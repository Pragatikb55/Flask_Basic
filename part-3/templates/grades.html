<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Grades | Jinja2 Loop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f0f4f8;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: left;
        }

        th {
            background-color: #edf2f7;
        }
    </style>
</head>

<body>

    <div class="container">

        <nav>
            <a href="/">Home</a>
            <a href="/profile">Profile</a>
            <a href="/skills">Skills</a>
            <a href="/projects">Projects</a>
            <a href="/grades">Grades</a>
        </nav>

        <h1>Student Grades</h1>
        <p>This table is generated using a Jinja2 <code>for</code> loop.</p>

        <table>
            <tr>
                <th>Subject</th>
                <th>Grade</th>
            </tr>

            {% for subject, grade in grades.items() %}
            <tr>
                <td>{{ subject }}</td>
                <td>{{ grade }}</td>
            </tr>
            {% endfor %}
        </table>

    </div>

</body>

</html>
